name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install
          gem install html-proofer

      - name: Build Jekyll site
        run: bundle exec jekyll build -d "_site"

      # ✅ This version ignores all external link checks *and* HTTP-only link errors
      - name: Run htmlproofer (ignore external + HTTP links)
        run: |
          echo "Running htmlproofer with external + http checks disabled..."
          bundle exec htmlproofer ./_site \
            --disable-external \
            --ignore-urls "^http://",".*"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
